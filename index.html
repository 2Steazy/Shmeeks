<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shmeeks</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#0d1554">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1b2a8f; --blue-deep:#0d1554; --purple:#5b1fa8;
  --yellow:#ffd23f; --orange:#ff8a1f; --pink:#ff3e8a; --green:#2fd27a; --red:#ff4d4d;
  --ink:#141414; --paper:#fffaf0; --muted:#6b6b6b;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:"Archivo",system-ui,sans-serif;color:var(--ink);
  background:var(--blue-deep);
  min-height:100vh;display:flex;justify-content:center;padding:24px 16px 48px;
  position:relative;overflow-x:hidden;
}
/* Game-show sunburst: the rays slowly turn behind everything */
body::before{
  content:"";position:fixed;left:50%;top:30vh;width:300vmax;height:300vmax;z-index:-2;
  translate:-50% -50%;
  background:repeating-conic-gradient(from 0deg, var(--blue) 0deg 10deg, var(--blue-deep) 10deg 20deg);
  animation:rays 160s linear infinite;
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 50% 30%, rgba(255,210,63,.20), transparent 55%);
}
@keyframes rays{to{rotate:360deg}}
.wrap{width:100%;max-width:620px}
header{text-align:center;margin-bottom:18px}
/* Shmeek coin */
.coin-logo{
  position:relative;display:block;width:clamp(96px,26vw,132px);aspect-ratio:1;margin:0 auto -6px;
  border-radius:50%;animation:float 4.5s ease-in-out infinite;
  filter:drop-shadow(0 10px 14px rgba(0,0,0,.45)) drop-shadow(0 0 22px rgba(255,200,40,.35));
}
.coin-logo img{width:100%;height:100%;display:block;border-radius:50%}
.coin-logo::after{  /* shine sweeping across the gold */
  content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:linear-gradient(115deg,transparent 38%,rgba(255,250,225,.75) 48%,transparent 58%) no-repeat;
  background-size:250% 100%;background-position:150% 0;mix-blend-mode:soft-light;
  animation:shine 6s ease-in-out 1.5s infinite;
}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes shine{0%,60%{background-position:150% 0}100%{background-position:-60% 0}}
.chip .mini{width:18px;height:18px;vertical-align:-3px;margin-right:6px;border-radius:50%}
.logo{
  font-family:"Bungee",sans-serif;font-size:clamp(44px,12vw,76px);line-height:1;margin:0;
  color:var(--yellow);letter-spacing:2px;
  text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--ink);
  transform:rotate(-3deg);display:inline-block;
}
.tagline{color:#fff;font-weight:900;letter-spacing:3px;text-transform:uppercase;font-size:13px;margin-top:12px;opacity:.9}
.card{
  background:var(--paper);border:4px solid var(--ink);border-radius:18px;
  box-shadow:8px 8px 0 var(--ink);padding:24px;position:relative;
}
.bulbs{position:absolute;inset:-4px;border-radius:18px;pointer-events:none;
  background:
    radial-gradient(circle,var(--yellow) 3px,transparent 4px) 0 0/22px 22px repeat-x,
    radial-gradient(circle,var(--yellow) 3px,transparent 4px) 0 100%/22px 22px repeat-x;
  opacity:.0}
h2{font-family:"Bungee",sans-serif;font-weight:400;margin:0 0 10px;font-size:22px}
p{line-height:1.5}
.btn{
  font-family:"Bungee",sans-serif;font-size:18px;letter-spacing:1px;
  background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:12px;
  padding:14px 22px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .08s, box-shadow .08s;
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:#fff}
.btn.pink{background:var(--pink);color:#fff}
.btn.block{width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row .btn{flex:1}
.ladder{list-style:none;padding:0;margin:14px 0 18px;display:grid;gap:6px}
.ladder li{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  border:3px solid var(--ink);border-radius:10px;padding:8px 12px;font-weight:900;
}
.ladder .tier-name{font-family:"Bungee",sans-serif;font-weight:400;font-size:14px}
.ladder .ex{font-weight:700;font-size:13px;color:#333;flex:1;text-align:right}
.ladder .pts{font-family:"Bungee",sans-serif;font-weight:400;min-width:64px;text-align:right}
.ladder li.hit{outline:4px solid var(--ink);transform:scale(1.03);box-shadow:4px 4px 0 var(--ink)}
.ladder li.dim{opacity:.45}
.ladder li.jp{border-color:var(--jp-red);box-shadow:inset 0 0 0 2px #fff3a0}
.ladder li.jp.hit{outline:4px solid var(--jp-red);background-size:300% 100% !important;animation:shimmer 2.2s linear infinite, glow 1s ease-in-out infinite alternate}

/* ----- Jackpot! ----- */
:root{--jp-red:#c1121f}
.reveal-banner{position:relative;overflow:hidden}
.reveal-banner > *{position:relative;z-index:1}
.reveal-banner.jackpot{
  background-size:300% 100% !important;border:5px solid var(--jp-red);
  box-shadow:0 0 0 4px #ffd700,0 0 0 9px var(--jp-red),0 0 34px 12px rgba(255,200,0,.65);
  animation:pop .5s cubic-bezier(.2,1.6,.4,1), shimmer 2.2s linear infinite, glow 1s ease-in-out .5s infinite alternate;
  margin:10px 6px 22px;
}
.reveal-banner.jackpot::before{
  content:"";position:absolute;left:50%;top:50%;width:260%;aspect-ratio:1;translate:-50% -50%;z-index:0;
  background:repeating-conic-gradient(rgba(193,18,31,.22) 0deg 9deg, transparent 9deg 18deg);
  animation:spin 9s linear infinite;
}
.reveal-banner.jackpot .t{color:var(--jp-red);text-shadow:2px 2px 0 #fff6b0,4px 4px 0 var(--ink);animation:bounce .8s ease-in-out .5s infinite alternate}
.reveal-banner.jackpot .p{color:var(--ink);text-shadow:1px 1px 0 #fff6b0}
@keyframes shimmer{from{background-position:0% 50%}to{background-position:300% 50%}}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.18) saturate(1.2)}}
@keyframes spin{to{rotate:360deg}}
@keyframes bounce{from{transform:scale(1)}to{transform:scale(1.08)}}
.coin{position:fixed;z-index:50;pointer-events:none;font-size:26px;left:0;top:0;
  animation:burst 1.5s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes burst{
  0%{transform:translate(var(--x0),var(--y0)) scale(.3) rotate(0);opacity:1}
  70%{opacity:1}
  100%{transform:translate(calc(var(--x0) + var(--dx)),calc(var(--y0) + var(--dy))) scale(1) rotate(var(--r));opacity:0}
}
.coin-img{width:30px;height:30px;display:block;border-radius:50%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
@media (prefers-reduced-motion:reduce){
  body::before,.coin-logo,.coin-logo::after{animation:none}
  .reveal-banner.jackpot,.reveal-banner.jackpot::before,.reveal-banner.jackpot .t,.ladder li.jp.hit{animation:none}
  .coin{display:none}
}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:#fff;font-weight:900}
.chip{background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:4px 12px;font-family:"Bungee",sans-serif;font-size:14px;box-shadow:3px 3px 0 var(--ink)}
.chip.y{background:var(--yellow);color:var(--ink)}
.cat{display:inline-block;background:var(--blue);color:#fff;font-weight:900;font-size:12px;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border-radius:6px;margin-bottom:10px}
.question{font-family:"Bungee",sans-serif;font-size:clamp(22px,5.5vw,30px);line-height:1.2;margin:0 0 18px}
.timer{height:16px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff;margin-bottom:6px}
.timer > div{height:100%;width:100%;background:var(--green);transition:background .3s}
.timer-label{display:flex;justify-content:space-between;font-weight:900;font-size:14px;margin-bottom:16px}
.tag{
  position:relative;display:flex;align-items:center;background:#fff;border:4px solid var(--ink);
  border-radius:14px 40px 40px 14px;padding:4px 6px 4px 18px;box-shadow:4px 4px 0 var(--ink);margin-bottom:16px;
}
.tag::after{content:"";position:absolute;right:16px;top:50%;width:12px;height:12px;margin-top:-6px;border:3px solid var(--ink);border-radius:50%;background:var(--paper)}
.tag input{
  flex:1;min-width:0;border:0;outline:0;background:transparent;font:900 22px "Archivo",sans-serif;
  padding:12px 40px 12px 0;color:var(--ink);
}
.reveal-banner{
  text-align:center;border:4px solid var(--ink);border-radius:14px;padding:16px;margin-bottom:16px;
  box-shadow:5px 5px 0 var(--ink);animation:pop .45s cubic-bezier(.2,1.6,.4,1);
}
.reveal-banner .t{font-family:"Bungee",sans-serif;font-size:clamp(28px,8vw,42px);line-height:1}
.reveal-banner .p{font-family:"Bungee",sans-serif;font-size:22px;margin-top:6px}
@keyframes pop{from{transform:scale(.4) rotate(-6deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.yours{font-weight:700;margin:0 0 4px}
.yours b{font-weight:900}
.fact{background:#fff3c4;border:3px dashed var(--ink);border-radius:10px;padding:12px 14px;margin:12px 0 16px;font-weight:500}
.total{font-family:"Bungee",sans-serif;font-size:clamp(48px,14vw,72px);text-align:center;line-height:1;margin:8px 0 2px;color:var(--pink);text-shadow:3px 3px 0 var(--ink)}
.of{text-align:center;font-weight:900;color:var(--muted);margin-bottom:10px}
.rank{text-align:center;font-family:"Bungee",sans-serif;font-size:20px;margin-bottom:8px}
.emojis{text-align:center;font-size:30px;letter-spacing:4px;margin:6px 0 16px}
.summary{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:6px}
.summary li{display:flex;gap:10px;align-items:center;border-bottom:2px dotted #ccc;padding:6px 0;font-size:14px}
.summary li span:nth-child(2){flex:1}
.summary small{color:var(--muted);display:block}
.summary .sp{font-family:"Bungee",sans-serif}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:900;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:420px){.card{padding:18px}.ladder .ex{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="coin-logo"><img src="assets/coin.webp" alt="" width="288" height="288"></div>
    <h1 class="logo">SHMEEKS</h1>
    <div class="tagline">Name the priciest. Win big.</div>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast"></div>

<script>

// Each tier is a shade of gold that gets richer on the way up to the Jackpot.

const MISS = {name:"NO SALE", pts:0, emoji:"⬛", color:"#bdbdbd"};
const ROUND_LEN = 7, TIME_LIMIT = 30;

/* ---------- Question bank ----------
   tiers[0] = the most expensive (Jackpot) ... tiers[4] = cheap (Bargain Bin),

/* ---------- Answer matching ---------- */
const FILLER = new Set("a an the type types of kind kinds variety breed color colour species most expensive i think its it is maybe probably answer".split(" "));
function norm(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/&/g," and ").replace(/['’`]/g,"").replace(/[^a-z0-9]+/g," ").trim();
}
function clean(s, nouns){
  const toks = norm(s).split(" ").filter(Boolean);
  const stripped = toks.filter(t => !FILLER.has(t) && !nouns.includes(t));
  return stripped.length ? stripped : toks.filter(t => !FILLER.has(t));
}
// Edit distance where swapping two neighboring letters ("parakete") counts as one typo.
function lev(a,b){
  if(a===b) return 0;
  const m=a.length,n=b.length, d=[];
  for(let i=0;i<=m;i++){ d[i]=[i]; }
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    const c=a[i-1]===b[j-1]?0:1;
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[m][n];
}
BANK.forEach(q=>{
  q.compiled = q.tiers.map(list=>list.map(a=>{
    const toks = clean(a,q.noun); return {toks, joined:toks.join("")};
  }));
});
// Returns tier index 0-4, or -1 for no match. Longest (most specific) alias wins,
// so "black summer truffle" scores as Summer, not Black.
function grade(raw,q){
  const toks = clean(raw,q.noun);
  if(!toks.length) return -1;
  const whole = toks.join("");
  let best=null;
  q.compiled.forEach((list,ti)=>list.forEach(a=>{
    // Model numbers (anything with a digit) must match exactly; words get typo slack.
    const L=a.joined.length, tol = /\d/.test(a.joined) ? 0 : L>=9?2 : L>=5?1 : 0;
    let d = Math.abs(whole.length-L)<=tol ? lev(whole,a.joined) : Infinity;
    for(let k=Math.max(1,a.toks.length-1); k<=a.toks.length+1; k++){
      for(let i=0;i+k<=toks.length;i++){
        const w=toks.slice(i,i+k).join("");
        if(Math.abs(w.length-L)<=tol) d=Math.min(d,lev(w,a.joined));
      }
    }
    if(d<=tol){
      const score = L*10 - d*3;
      if(!best || score>best.score || (score===best.score && ti<best.ti)) best={ti,score};
    }
  }));
  return best ? best.ti : -1;
}

/* ---------- Daily seed ---------- */
function todayKey(){ return new Date().toLocaleDateString("en-CA"); }
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}
function pickRound(rng){
  const idx=BANK.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  return idx.slice(0,ROUND_LEN).map(i=>BANK[i]);
}
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};

/* ---------- Game state ---------- */
const app=document.getElementById("app");
let S=null, timerId=null, keyLock=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const total=()=>S.results.reduce((a,r)=>a+r.tier.pts,0);
const fmt=n=>n.toLocaleString("en-US");

function ladderHTML(q,hit){
  return `<ul class="ladder">${TIERS.map((t,i)=>`
    <li class="${i===0?"jp ":""}${hit===undefined?"":(i===hit?"hit":"dim")}" style="background:${t.color}">
      <span class="tier-name">${t.emoji} ${t.name}</span>
      ${q?`<span class="ex">${esc(q.ladder[i])}</span>`:""}
      <span class="pts">${t.pts}</span>
    </li>`).join("")}</ul>`;
}

function home(){
  clearInterval(timerId);
  const day=todayKey(), done=store.get("shmeeks-daily-"+day);
  app.innerHTML=`<div class="card">
    <h2>Come on down!</h2>
    <p>Every question asks for the <b>most expensive</b> type of something. Type your answer. You have <b>${TIME_LIMIT} seconds</b> per question and ${ROUND_LEN} questions per round. The closer you get to the top price, the bigger the payout:</p>
    ${ladderHTML()}
    ${done ? `<p style="text-align:center;font-weight:900">Today's round: ${fmt(done.score)} pts &nbsp;${done.emojis}</p>
      <div class="row"><button class="btn pink" id="bonus">Bonus round</button><button class="btn alt" id="share">Share today</button></div>`
      : `<button class="btn block" id="play">Play today's round</button>`}
    <p class="note">A new daily round drops at midnight. Typos are forgiven.</p>
  </div>`;
  if(done){
    bonus.onclick=()=>start("bonus");
    share.onclick=()=>shareResult(done.score,done.emojis,day);
  } else play.onclick=()=>start("daily");
}

function start(mode){
  const rng = mode==="daily" ? mulberry32(hashStr("shmeeks"+todayKey())) : Math.random;
  S={mode, qs:pickRound(rng), i:0, results:[]};
  ask();
}

function ask(){
  const q=S.qs[S.i];
  app.innerHTML=`
    <div class="hud"><span class="chip">Q ${S.i+1} / ${ROUND_LEN}</span><span class="chip y"><img class="mini" src="assets/coin-small.webp" alt="">${fmt(total())} pts</span></div>
    <div class="card">
      <span class="cat">${esc(q.cat)}</span>
      <p class="question">${esc(q.q)}</p>
      <div class="timer"><div id="bar"></div></div>
      <div class="timer-label"><span>Time left</span><span id="secs">${TIME_LIMIT}s</span></div>
      <form id="f" autocomplete="off">
        <div class="tag"><input id="ans" type="text" placeholder="Type your answer…" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="60" aria-label="Your answer"></div>
        <button class="btn block" type="submit">Lock it in!</button>
      </form>
    </div>`;
  const input=document.getElementById("ans"); input.focus();
  document.getElementById("f").onsubmit=e=>{
    e.preventDefault();
    if(!input.value.trim()){ input.parentElement.classList.remove("shake"); void input.offsetWidth; input.parentElement.classList.add("shake"); return; }
    lockIn(false);
  };
  const t0=performance.now(), bar=document.getElementById("bar"), secs=document.getElementById("secs");
  clearInterval(timerId);
  timerId=setInterval(()=>{
    const left=Math.max(0,TIME_LIMIT-(performance.now()-t0)/1000), frac=left/TIME_LIMIT;
    bar.style.width=(frac*100)+"%";
    bar.style.background = frac>.5?"var(--green)":frac>.2?"var(--orange)":"var(--red)";
    secs.textContent=Math.ceil(left)+"s";
    if(left<=0) lockIn(true);
  },100);
}

function lockIn(timedOut){
  clearInterval(timerId);
  const q=S.qs[S.i], raw=(document.getElementById("ans")?.value||"").trim();
  const ti = raw ? grade(raw,q) : -1;
  const tier = ti>=0 ? TIERS[ti] : MISS;
  S.results.push({q, raw, ti, tier, timedOut});
  reveal();
}

function reveal(){
  const r=S.results[S.i], last=S.i===ROUND_LEN-1;
  app.innerHTML=`
    <div class="hud"><span class="chip">Q ${S.i+1} / ${ROUND_LEN}</span><span class="chip y"><img class="mini" src="assets/coin-small.webp" alt="">${fmt(total())} pts</span></div>
    <div class="card">
      <div class="reveal-banner${r.ti===0?" jackpot":""}" id="banner" style="background:${r.tier.color}">
        <div class="t">${r.timedOut && !r.raw ? "TIME'S UP!" : r.tier.name}</div>
        <div class="p">+${r.tier.pts}</div>
      </div>
      <p class="yours">You said: <b>${r.raw?esc(r.raw):"<i>nothing</i>"}</b>${r.timedOut&&r.raw?" (buzzer!)":""}</p>
      <p class="yours">Top price: <b>${esc(r.q.ladder[0])}</b></p>
      ${ladderHTML(r.q, r.ti>=0?r.ti:-1)}
      <div class="fact">💡 ${esc(r.q.fact)}</div>
      <button class="btn block" id="next">${last?"See my winnings":"Next question"}</button>
    </div>`;
  next.onclick=advance;
  keyLock=true; setTimeout(()=>keyLock=false,500);
  if(r.ti===0) setTimeout(coinBurst,250);
}

// Shower of coins and sparkles out of the Jackpot banner.
function coinBurst(){
  const b=document.getElementById("banner"); if(!b) return;
  const box=b.getBoundingClientRect(), cx=box.left+box.width/2, cy=box.top+box.height/2;
  const bits=["coin","✨","coin","💰","coin","⭐"];   // "coin" = a real Shmeek coin
  for(let i=0;i<34;i++){
    const s=document.createElement("span"); s.className="coin";
    if(bits[i%bits.length]==="coin"){ const im=new Image(); im.src="assets/coin-small.webp"; im.className="coin-img"; s.appendChild(im); }
    else s.textContent=bits[i%bits.length];
    const ang=Math.random()*Math.PI*2, dist=120+Math.random()*220;
    s.style.setProperty("--x0",(cx-13)+"px"); s.style.setProperty("--y0",(cy-13)+"px");
    s.style.setProperty("--dx",Math.cos(ang)*dist+"px");
    s.style.setProperty("--dy",(Math.sin(ang)*dist*0.7+120)+"px");
    s.style.setProperty("--r",(Math.random()*720-360)+"deg");
    s.style.animationDelay=(Math.random()*0.25)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),2000);
  }
}

function advance(){
  S.i++;
  if(S.i<ROUND_LEN) ask(); else finish();
}

function rankFor(score){
  if(score>=6000) return "🏆 Showcase Champion";
  if(score>=4500) return "🎡 Big Wheel Winner";
  if(score>=3000) return "🛋️ Contestant's Row Regular";
  if(score>=1500) return "🛒 Bargain Hunter";
  return "🪟 Window Shopper";
}

function finish(){
  const score=total(), emojis=S.results.map(r=>r.tier.emoji).join(""), day=todayKey();
  if(S.mode==="daily") store.set("shmeeks-daily-"+day,{score,emojis});
  const best=Math.max(store.get("shmeeks-best")||0,score); store.set("shmeeks-best",best);
  app.innerHTML=`<div class="card">
    <h2 style="text-align:center">${S.mode==="daily"?"Today's winnings":"Bonus round"}</h2>
    <div class="total" id="tot">0</div>
    <div class="of">out of ${fmt(ROUND_LEN*1000)} · best ever ${fmt(best)}</div>
    <div class="rank">${rankFor(score)}</div>
    <div class="emojis">${emojis}</div>
    <ul class="summary">${S.results.map(r=>`
      <li><span>${r.tier.emoji}</span>
        <span>${esc(r.q.q.replace(/^What is the |^Which /,"").replace(/\?$/,""))}
          <small>You: ${r.raw?esc(r.raw):"—"} · Top: ${esc(r.q.ladder[0])}</small></span>
        <span class="sp">${r.tier.pts}</span></li>`).join("")}</ul>
    <div class="row">
      ${S.mode==="daily"?`<button class="btn pink" id="share">Share</button>`:""}
      <button class="btn" id="again">Bonus round</button>
      <button class="btn alt" id="menu">Home</button>
    </div>
  </div>`;
  if(S.mode==="daily") share.onclick=()=>shareResult(score,emojis,day);
  again.onclick=()=>start("bonus");
  menu.onclick=home;
  // count-up
  const el=document.getElementById("tot"), t0=performance.now();
  (function tick(now){const p=Math.min(1,(now-t0)/900);el.textContent=fmt(Math.round(score*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(tick);})(t0);
}

function shareResult(score,emojis,day){
  const text=`SHMEEKS ${day}\n${emojis}\n${fmt(score)} / ${fmt(ROUND_LEN*1000)} · ${rankFor(score)}`;
  const done=()=>toast("Copied to clipboard!");
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text));
  else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");toast("Copied to clipboard!");}catch(e){toast("Couldn't copy");}
  ta.remove();
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600);}

document.addEventListener("keydown",e=>{
  if(e.key==="Enter" && document.getElementById("next") && !keyLock){ e.preventDefault(); advance(); }
});

home();
